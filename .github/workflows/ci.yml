name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  RAYLIB_LINUX_SHA256: "3d95ef03d5b38dfa55c0a16ca122d382134b078f0e5b270b52fe7eae0549c000"
  RAYLIB_WIN64_SHA256: "fe8feda1b92fc02826e2d19c631d648fd0563b93b144893fe18140e9fe4fb6fd"

jobs:
  linux:
    name: Linux (GCC + ASan/UBSan + Tests + Fuzz + UI Smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install X11, OpenGL, and Xvfb libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libgl1-mesa-dri \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            xvfb

      - name: Fetch and SHA-256 verify raylib 5.5 (Linux amd64)
        run: |
          mkdir -p "$RUNNER_TEMP/raylib"
          curl -fsSL -o "$RUNNER_TEMP/raylib-5.5_linux_amd64.tar.gz" \
            https://github.com/raysan5/raylib/releases/download/5.5/raylib-5.5_linux_amd64.tar.gz
          printf '%s  %s\n' "$RAYLIB_LINUX_SHA256" "$RUNNER_TEMP/raylib-5.5_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/raylib-5.5_linux_amd64.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/raylib"

      - name: Check architectural layering and portability rules
        run: make check-layering

      - name: Build and run tests under ASan + UBSan
        run: make BUILD=debug test

      - name: Build and run parser fuzz harnesses under ASan + UBSan
        run: make BUILD=debug fuzz-test

      - name: Build and run UI smoke test under Xvfb + ASan/UBSan
        run: |
          RAYLIB_DIR="$RUNNER_TEMP/raylib" make BUILD=debug ui-smoke

      - name: Build desktop application (Debug + ASan/UBSan)
        run: RAYLIB_DIR="$RUNNER_TEMP/raylib" make BUILD=debug app

      - name: Build static-raylib release app, verify --version and install/uninstall
        run: |
          RAYLIB_DIR="$RUNNER_TEMP/raylib" RAYLIB_STATIC=1 make BUILD=release app test
          ./build/linux-release/rata-workspace --version
          ! ldd ./build/linux-release/rata-workspace | grep -i libraylib
          RAYLIB_DIR="$RUNNER_TEMP/raylib" RAYLIB_STATIC=1 make BUILD=release install PREFIX="$RUNNER_TEMP/stage"
          test -x "$RUNNER_TEMP/stage/bin/rata-workspace"
          test -f "$RUNNER_TEMP/stage/share/applications/rata-workspace.desktop"
          test -f "$RUNNER_TEMP/stage/share/icons/hicolor/256x256/apps/rata-workspace.png"
          make uninstall PREFIX="$RUNNER_TEMP/stage"

  windows-mingw:
    name: Windows 11 (MSYS2 MinGW-w64 GCC Static)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            make
            curl
            unzip

      - name: Fetch and SHA-256 verify raylib 5.5 (Windows MinGW-w64)
        run: |
          mkdir -p "$RUNNER_TEMP/raylib-dl"
          curl -fsSL -o "$RUNNER_TEMP/raylib.zip" \
            https://github.com/raysan5/raylib/releases/download/5.5/raylib-5.5_win64_mingw-w64.zip
          printf '%s  %s\n' "$RAYLIB_WIN64_SHA256" "$RUNNER_TEMP/raylib.zip" | sha256sum -c -
          unzip -q -o "$RUNNER_TEMP/raylib.zip" -d "$RUNNER_TEMP/raylib-dl"

      - name: Check layering rules
        run: make check-layering

      - name: Build static Windows exe, verify DLL deps, and run tests + fuzz harnesses
        run: |
          RAYLIB_DIR="$(cygpath -m "$RUNNER_TEMP/raylib-dl/raylib-5.5_win64_mingw-w64")"
          RAYLIB_DIR="$RAYLIB_DIR" make BUILD=release app
          ./build/windows-release/rata-workspace.exe --version
          objdump -p ./build/windows-release/rata-workspace.exe | grep "DLL Name:"
          if objdump -p ./build/windows-release/rata-workspace.exe | grep "DLL Name:" | grep -iE 'raylib|libgcc|winpthread|stdc\+\+'; then
            echo "ERROR: non-system DLL dependency detected!"
            exit 1
          fi
          make BUILD=release test fuzz-test
