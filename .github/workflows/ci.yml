name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  linux:
    name: Linux (GCC + ASan/UBSan + Tests + Fuzz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install X11/OpenGL dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev

      - name: Fetch raylib 5.5 (Linux amd64)
        run: |
          mkdir -p "$RUNNER_TEMP/raylib"
          curl -fsSL https://github.com/raysan5/raylib/releases/download/5.5/raylib-5.5_linux_amd64.tar.gz \
            | tar -xz --strip-components=1 -C "$RUNNER_TEMP/raylib"

      - name: Check architectural layering and portability rules
        run: make check-layering

      - name: Build and run tests under ASan + UBSan
        run: make BUILD=debug test

      - name: Build and run parser fuzz harnesses under ASan + UBSan
        run: make BUILD=debug fuzz-test

      - name: Build desktop application (Debug + ASan/UBSan)
        run: RAYLIB_DIR="$RUNNER_TEMP/raylib" make BUILD=debug app

      - name: Build desktop application and tests (Release)
        run: |
          RAYLIB_DIR="$RUNNER_TEMP/raylib" make BUILD=release app test

  windows-mingw:
    name: Windows 11 (MSYS2 MinGW-w64 GCC)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW64 toolchain and raylib
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-raylib
            make

      - name: Check layering rules
        run: make check-layering

      - name: Build desktop app and run tests + fuzz harnesses
        run: |
          make BUILD=release app
          make BUILD=release test fuzz-test
